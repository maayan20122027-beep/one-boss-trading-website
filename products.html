<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products | ONE BOSS TRADING LLC</title>
  <style>
    :root {
      --black: #090909;
      --gold: #d4af37;
      --white: #ffffff;
      --muted: #b7b7b7;
      --panel: #151515;
      --border: #303030;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--black);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }
    .container { width: min(1160px, 92%); margin: 0 auto; }

    header {
      background: #101010;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .navbar {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      padding: 15px 0;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
      white-space: nowrap;
    }
    .brand-text strong {
      color: var(--gold);
      font-size: 1.35rem;
      letter-spacing: 2px;
    }
    .brand-text span {
      font-size: 0.76rem;
      letter-spacing: 3px;
      color: var(--white);
    }

    .site-logo {
      width: clamp(72px, 10vw, 120px);
      height: auto;
      display: block;
      margin-left: auto;
      filter: drop-shadow(0 8px 18px rgba(212, 175, 55, 0.2));
    }

    nav {
      display: flex;
      gap: 25px;
      flex-wrap: wrap;
      align-items: center;
    }
    nav a { font-size: 0.95rem; }
    nav a:hover, nav a.active { color: var(--gold); }

    .hero {
      padding: 75px 0 60px;
      text-align: center;
      background: radial-gradient(ellipse at top, #292211 0%, #090909 65%);
      border-bottom: 1px solid var(--border);
    }
    .eyebrow {
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 0.8rem;
      font-weight: bold;
    }
    h1 {
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      line-height: 1.2;
      margin: 14px 0;
    }
    .hero p { color: var(--muted); max-width: 680px; margin: auto; }

    @media (max-width: 560px) {
      .navbar {
        justify-content: center;
        text-align: center;
      }
      nav {
        justify-content: center;
        gap: 15px;
      }
      .site-logo {
        width: 90px;
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="container navbar">
      <a href="index.html" class="brand-text" aria-label="ONE BOSS TRADING LLC Home">
        <strong>ONE BOSS</strong>
        <span>TRADING LLC</span>
      </a>

      <img class="site-logo" src="logo.png.png" alt="ONE BOSS TRADING LLC logo" />

      <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="products.html" class="active">Products</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <span class="eyebrow">Quality • Value • Trust</span>
        <h1>Explore Our <span style="color: var(--gold);">Products</span></h1>
        <p>Discover phones, tablets, computers and accessories tailored for wholesale, bulk, and individual enquiries.</p>
      </div>
    </section>
  </main>
</body>
</html>
