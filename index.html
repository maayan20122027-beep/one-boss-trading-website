<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONE BOSS TRADING LLC | Global Electronics Trading</title>
  <style>
    :root {
      --black: #090909;
      --gold: #d5ad55;
      --white: #ffffff;
      --muted: #b6b6b6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--black);
      color: var(--white);
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }
    .container { width: min(1160px, 90%); margin: 0 auto; }

    header {
      background: rgba(9, 9, 9, 0.97);
      border-bottom: 1px solid #292929;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    nav {
      min-height: 86px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .site-logo {
      width: clamp(72px, 10vw, 120px);
      height: auto;
      display: block;
      order: -1;
      margin-right: auto;
      filter: drop-shadow(0 8px 18px rgba(212, 175, 55, 0.25));
    }

    .brand {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 1.5px;
      line-height: 1.3;
      white-space: nowrap;
    }
    .brand span {
      display: block;
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 4px;
      margin-top: 4px;
    }

    .nav-links {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 13px;
      flex-wrap: wrap;
    }
    .nav-links a:hover { color: var(--gold); }
    .nav-cta {
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 10px 17px;
      display: inline-block;
    }

    main {
      padding: 80px 0 40px;
      text-align: center;
    }
    h1 {
      font-size: clamp(32px, 5vw, 54px);
      margin-bottom: 18px;
    }
    p { color: var(--muted); }

    @media (max-width: 760px) {
      nav {
        padding: 16px 0;
        align-items: flex-start;
        flex-direction: column;
      }
      .nav-links {
        gap: 12px 18px;
      }
      .site-logo {
        width: 90px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <nav>
        <img class="site-logo" src="logo.png.png" alt="ONE BOSS TRADING LLC logo" />
        <a href="index.html" class="brand">
          ONE BOSS
          <span>TRADING LLC</span>
        </a>

        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="products.html">Products</a></li>
          <li><a href="#contact">Contact</a></li>
          <li><a class="nav-cta" href="https://wa.me/971522740627" target="_blank" rel="noopener noreferrer">ENQUIRE NOW</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>ONE BOSS TRADING LLC</h1>
    <p>Logo size fixed to fit the header proportion.</p>
  </main>
</body>
</html>
