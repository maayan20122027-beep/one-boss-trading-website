<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ONE BOSS TRADING LLC is a Dubai-based electronics trading company offering wholesale, bulk, individual and mixed-grade sourcing solutions.">
    <title>ONE BOSS TRADING LLC | Global Electronics Trading</title>
    <style>
        :root {
            --black: #090909;
            --dark: #111111;
            --gold: #d5ad55;
            --light-gold: #f1d58d;
            --white: #ffffff;
            --muted: #b6b6b6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--black);
            color: var(--white);
            line-height: 1.7;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            width: min(1160px, 90%);
            margin: auto;
        }

        .announcement {
            background: var(--gold);
            color: #111;
            text-align: center;
            padding: 8px 15px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        header {
            background: rgba(9, 9, 9, 0.97);
            border-bottom: 1px solid #292929;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav {
            min-height: 86px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 25px;
        }

        .brand {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: 1.5px;
            line-height: 1.3;
        }

        .brand span {
            display: block;
            color: var(--gold);
            font-size: 10px;
            letter-spacing: 4px;
            margin-top: 5px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
            list-style: none;
            font-size: 13px;
        }

        .nav-links a:hover {
            color: var(--gold);
        }

        .nav-cta {
            border: 1px solid var(--gold);
            padding: 10px 17px;
            color: var(--gold);
        }

        .site-logo {
            width: clamp(110px, 14vw, 170px);
            height: auto;
            display: block;
            order: -1;
            margin-right: auto;
            margin-left: 0;
            filter: drop-shadow(0 8px 18px rgba(212, 175, 55, 0.25));
        }

        .hero {
            min-height: 590px;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(90deg,
                    rgba(9,9,9,0.98) 0%,
                    rgba(9,9,9,0.90) 45%,
                    rgba(9,9,9,0.45) 100%),
                url("https://images.unsplash.com/photo-1498049794561-7780e7231661?auto=format&fit=crop&w=2000&q=85")
                center/cover no-repeat;
        }

        .hero-content {
            max-width: 720px;
            padding: 90px 0;
        }

        .eyebrow {
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 22px;
        }

        h1 {
            font-size: clamp(38px, 6vw, 72px);
            line-height: 1.08;
            letter-spacing: -2px;
            margin-bottom: 25px;
        }

        h1 span {
            color: var(--gold);
        }

        .hero-description {
            max-width: 570px;
            color: #d0d0d0;
            font-size: 16px;
            margin-bottom: 34px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-block;
            padding: 14px 24px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            transition: 0.25s;
        }

        .button-gold {
            background: var(--gold);
            color: #111;
        }

        .button-gold:hover {
            background: var(--light-gold);
            transform: translateY(-2px);
        }

        .button-outline {
            border: 1px solid #777;
            color: white;
        }

        .button-outline:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .trust-strip {
            border-top: 1px solid #292929;
            border-bottom: 1px solid #292929;
            background: #101010;
        }

        .trust-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
        }

        .trust-item {
            padding: 27px 15px;
            text-align: center;
            border-right: 1px solid #292929;
        }

        .trust-item:last-child {
            border-right: none;
        }

        .trust-item strong {
            display: block;
            color: var(--gold);
            font-size: 14px;
            margin-bottom: 4px;
        }

        .trust-item span {
            color: var(--muted);
            font-size: 12px;
        }

        section {
            padding: 95px 0;
        }

        .section-heading {
            max-width: 720px;
            margin-bottom: 48px;
        }

        .section-heading h2 {
            font-size: clamp(30px, 4vw, 43px);
            line-height: 1.2;
            margin-bottom: 17px;
        }

        .section-heading h2 span {
            color: var(--gold);
        }

        .section-heading p {
            color: var(--muted);
            font-size: 15px;
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 65px;
            align-items: center;
        }

        .about-copy p {
            color: #c0c0c0;
            margin-bottom: 18px;
        }

        .about-panel {
            background: linear-gradient(145deg, #1d1d1d, #0e0e0e);
            border: 1px solid #343434;
            padding: 35px;
        }

        .about-panel h3 {
            color: var(--gold);
            font-size: 20px;
            margin-bottom: 20px;
        }

        .about-panel ul {
            list-style: none;
        }

        .about-panel li {
            padding: 11px 0;
            border-bottom: 1px solid #303030;
            color: #dedede;
            font-size: 14px;
        }

        .about-panel li:last-child {
            border-bottom: none;
        }

        .check {
            color: var(--gold);
            margin-right: 10px;
        }

        .services-section {
            background: #101010;
        }

        .service-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .service-card {
            background: #151515;
            border: 1px solid #2d2d2d;
            padding: 30px;
            transition: 0.25s;
        }

        .service-card:hover {
            border-color: var(--gold);
            transform: translateY(-4px);
        }

        .service-number {
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--gold);
            margin-bottom: 20px;
        }

        .service-card h3 {
            font-size: 19px;
            margin-bottom: 12px;
        }

        .service-card p {
            color: var(--muted);
            font-size: 14px;
        }

        .sourcing-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .source-card {
            border: 1px solid #303030;
            background: #121212;
            padding: 28px 18px;
            text-align: center;
        }

        .source-card h3 {
            color: var(--gold);
            font-size: 17px;
            margin-bottom: 8px;
        }

        .source-card p {
            font-size: 12px;
            color: var(--muted);
        }

        .cta {
            background: linear-gradient(110deg, #17130a, #101010 75%);
            border-top: 1px solid #3d321b;
            border-bottom: 1px solid #3d321b;
            text-align: center;
        }

        .cta h2 {
            font-size: clamp(30px, 4vw, 44px);
            margin-bottom: 18px;
        }

        .cta h2 span {
            color: var(--gold);
        }

        .cta p {
            color: var(--muted);
            max-width: 650px;
            margin: 0 auto 28px;
        }

        .cta .buttons {
            justify-content: center;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .contact-card {
            padding: 25px;
            background: #121212;
            border: 1px solid #2c2c2c;
        }

        .contact-card h3 {
            color: var(--gold);
            font-size: 14px;
            margin-bottom: 9px;
        }

        .contact-card p,
        .contact-card a {
            color: #d1d1d1;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .contact-card a:hover {
            color: var(--gold);
        }

        footer {
            background: #050505;
            border-top: 1px solid #292929;
            padding: 30px 0;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .footer-brand {
            color: var(--gold);
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        footer p {
            color: #858585;
            font-size: 11px;
        }

        @media (max-width: 760px) {
            nav {
                padding: 17px 0;
                align-items: flex-start;
                flex-direction: column;
                gap: 16px;
            }

            .nav-links {
                flex-wrap: wrap;
                gap: 15px;
                font-size: 12px;
            }

            .nav-cta {
                padding: 7px 10px;
            }

            .hero {
                min-height: 520px;
                background-position: 60% center;
            }

            .hero-content {
                padding: 75px 0;
            }

            .trust-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .trust-item:nth-child(2) {
                border-right: none;
            }

            .trust-item:nth-child(-n+2) {
                border-bottom: 1px solid #292929;
            }

            section {
                padding: 65px 0;
            }

            .about-grid {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .service-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .sourcing-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .contact-grid {
                grid-template-columns: 1fr;
            }

            .site-logo {
                width: min(100%, 150px);
                margin-left: 0;
                margin-right: 0;
            }
        }

        @media (max-width: 450px) {
            .service-grid {
                grid-template-columns: 1fr;
            }

            .hero-description {
                font-size: 14px;
            }

            .button {
                padding: 13px 17px;
            }

            .about-panel {
                padding: 25px;
            }
        }
    </style>
</head>
<body>

    <div class="announcement">
        GLOBAL ELECTRONICS SOURCING · DUBAI, UAE
    </div>

    <header>
        <div class="container">
            <nav>
                <img class="site-logo" src="logo.png.png" alt="ONE BOSS TRADING LLC logo">
                <a href="index.html" class="brand">
                    ONE BOSS
                    <span>TRADING LLC</span>
                </a>

                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="#services">Services</a></li>
                    <li><a href="#contact">Contact</a></li>
                    <li>
                        <a class="nav-cta"
                            href="https://wa.me/971522740627"
                            target="_blank"
                            rel="noopener noreferrer">
                            ENQUIRE NOW
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
